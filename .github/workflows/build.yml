name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          else
            cd $(dirname $(find . -maxdepth 2 -name "pubspec.yaml" | head -n 1))
            flutter pub get
          fi

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --release --no-tree-shake-icons
          else
            CD_DIR=$(dirname $(find . -maxdepth 2 -name "pubspec.yaml" | head -n 1))
            cd $CD_DIR
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fahmani-App-Release
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
